<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover, user-scalable=no" />
  <title>C-1 - 이미지 오버레이</title>
  <style>
    :root {
      --bg: #f5f8ff;
      --panel: #ffffff;
      --panel-solid: #ffffff;
      --text: #1c1c1e;
      --muted: #555a6a;
      --accent: #5b76fe;
      --accent-2: #00b473;
      --danger: #d54343;
      --stroke: #c7cad5;
      --ring: rgb(224, 226, 232);
      --shadow: 0 18px 34px rgba(34, 48, 79, 0.07);
    }

    html, body {
      height: 100%;
    }

    body {
      margin: 0;
      color: var(--text);
      background:
        radial-gradient(circle at 7% 8%, #eaf0ff 0%, transparent 35%),
        radial-gradient(circle at 94% 0%, #fde8ef 0%, transparent 26%),
        linear-gradient(180deg, var(--bg), #eef2ff);
      font: 16px/1.5 "Noto Sans KR", "Segoe UI", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    .app {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
    }

    .stage {
      position: relative;
      flex: 1;
      overflow: hidden;
      touch-action: none;
      background: #f6f9ff;
    }

    .checker {
      position: absolute;
      inset: 0;
      background:
        linear-gradient(45deg, #eaf0ff 25%, transparent 25%) -10px 0/20px 20px,
        linear-gradient(-45deg, #eaf0ff 25%, transparent 25%) -10px 0/20px 20px,
        linear-gradient(45deg, transparent 75%, #eaf0ff 75%) -10px 0/20px 20px,
        linear-gradient(-45deg, transparent 75%, #eaf0ff 75%) -10px 0/20px 20px,
        #f9fbff;
      pointer-events: none;
    }

    canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
      touch-action: none;
    }

    .topbar {
      position: absolute;
      inset: env(safe-area-inset-top) 0 auto 0;
      z-index: 10;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      padding: 8px 12px;
      pointer-events: none;
    }

    .chip {
      pointer-events: auto;
      background: rgba(255, 255, 255, 0.92);
      border: 1px solid var(--stroke);
      border-radius: 12px;
      padding: 6px 10px;
      box-shadow: 0 0 0 1px var(--ring);
      font-size: 12px;
      line-height: 1.4;
    }

    .toolbar {
      position: relative;
      z-index: 11;
      padding: env(safe-area-inset-bottom, 0);
      background: linear-gradient(180deg, rgba(255, 255, 255, 0.35), #eff4ff);
    }

    .bar {
      display: grid;
      gap: 10px;
      grid-template-columns: repeat(6, 1fr);
      padding: 12px 12px calc(12px + env(safe-area-inset-bottom));
    }

    .btn,
    .file-btn,
    .mini {
      -webkit-tap-highlight-color: transparent;
      appearance: none;
      border: 1px solid var(--stroke);
      outline: none;
      border-radius: 12px;
      background: #fff;
      color: var(--text);
      box-shadow: 0 0 0 1px var(--ring);
      font-size: 12px;
      font-weight: 600;
      text-align: center;
    }

    .btn,
    .file-btn {
      padding: 12px 10px;
    }

    .btn:active,
    .file-btn:active,
    .mini:active {
      transform: translateY(1px);
    }

    .btn.primary {
      color: #fff;
      background: linear-gradient(180deg, #5b76fe, #2a41b6);
      border-color: #4f66df;
      box-shadow: 0 6px 14px rgba(91, 118, 254, 0.25);
    }

    .btn.danger,
    .mini.danger {
      color: #d54343;
      border-color: #ef9f98;
      background: #fdebe9;
    }

    .btn.locked,
    .mini.locked {
      color: #fff;
      background: linear-gradient(180deg, #7f8aa0, #667184);
      border-color: #667184;
    }

    .btn:disabled {
      opacity: 0.45;
      cursor: not-allowed;
      transform: none;
    }

    .file-btn {
      position: relative;
      overflow: hidden;
      cursor: pointer;
    }

    .file-btn input {
      position: absolute;
      inset: 0;
      opacity: 0;
      cursor: pointer;
    }

    .slider-wrap {
      grid-column: span 6;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 10px;
      border-radius: 14px;
      background: #fff;
      border: 1px solid var(--stroke);
      box-shadow: 0 0 0 1px var(--ring);
    }

    .slider-wrap label {
      font-size: 12px;
      color: var(--muted);
      white-space: nowrap;
    }

    input[type="range"] {
      width: 100%;
      height: 28px;
      -webkit-appearance: none;
      background: transparent;
    }

    input[type="range"]::-webkit-slider-runnable-track {
      height: 6px;
      background: #dfe4f2;
      border-radius: 999px;
    }

    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 22px;
      height: 22px;
      border-radius: 50%;
      background: #5b76fe;
      margin-top: -8px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.35);
    }

    .pill {
      font-size: 11px;
      padding: 6px 10px;
      border-radius: 999px;
      background: #fff;
      border: 1px solid var(--stroke);
      color: var(--muted);
      white-space: nowrap;
    }

    .layer-wrap {
      grid-column: span 6;
      border-radius: 14px;
      background: #fff;
      border: 1px solid var(--stroke);
      box-shadow: 0 0 0 1px var(--ring);
      overflow: hidden;
    }

    .layer-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      padding: 10px;
      border-bottom: 1px solid #e7ebf5;
      font-size: 12px;
      color: var(--muted);
    }

    .mini {
      padding: 8px 10px;
      border-radius: 10px;
      box-shadow: none;
    }

    .layer-list {
      padding: 10px;
      display: grid;
      gap: 8px;
      max-height: 170px;
      overflow-y: auto;
    }

    .layer-item {
      display: grid;
      grid-template-columns: auto 1fr auto auto;
      align-items: center;
      gap: 8px;
      border-radius: 12px;
      border: 1px solid var(--stroke);
      background: #fff;
      padding: 8px;
      cursor: pointer;
    }

    .layer-item.active {
      border-color: #7c8cff;
      box-shadow: inset 0 0 0 1px rgba(124, 140, 255, 0.35);
    }

    .layer-index {
      width: 26px;
      height: 26px;
      border-radius: 999px;
      display: grid;
      place-items: center;
      font-size: 11px;
      background: #edf1ff;
      color: #42528f;
      font-weight: 700;
    }

    .layer-name {
      font-size: 12px;
      color: var(--text);
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .layer-item .mini {
      font-size: 11px;
      padding: 7px 8px;
      background: #fff;
      border: 1px solid var(--stroke);
    }

    .layer-item .mini.danger {
      border: none;
    }

    .empty {
      font-size: 12px;
      color: var(--muted);
      text-align: center;
      padding: 14px 8px;
      border-radius: 10px;
      border: 1px dashed #d6dceb;
      background: #f9fbff;
    }

    .toast {
      position: absolute;
      left: 50%;
      bottom: 120px;
      transform: translateX(-50%);
      background: rgba(28, 28, 30, 0.9);
      color: #fff;
      padding: 10px 14px;
      border-radius: 999px;
      box-shadow: var(--shadow);
      font-size: 12px;
      display: none;
      pointer-events: none;
      z-index: 12;
    }

    .toast.show {
      display: inline-block;
    }

    @supports (height: 100dvh) {
      .app {
        height: 100dvh;
      }
    }
  </style>
</head>
<body>
  <div class="app">
    <div class="topbar">
      <div class="chip" id="status">원본 이미지를 불러오세요.</div>
      <div class="chip" id="mode-pill">대기</div>
    </div>

    <div class="stage" id="stage">
      <div class="checker"></div>
      <canvas id="canvas" aria-label="이미지 오버레이 캔버스"></canvas>
      <div class="toast" id="toast"></div>
    </div>

    <div class="toolbar">
      <div class="bar">
        <label class="file-btn" title="원본 이미지 불러오기">
          원본
          <input id="baseInput" type="file" accept="image/*" />
        </label>
        <label class="file-btn" title="오버레이 이미지 추가">
          오버레이 추가
          <input id="overlayInput" type="file" accept="image/*" multiple />
        </label>
        <button class="btn ghost" id="resetView" title="화면 위치 초기화">화면 초기화</button>
        <button class="btn ghost" id="lockBase" title="원본 이동/확대 잠금">원본 잠금: 해제</button>
        <button class="btn" id="removeOverlay" title="선택 레이어 삭제">선택 삭제</button>
        <button class="btn primary" id="exportBtn" title="PNG 저장">PNG 저장</button>

        <div class="slider-wrap">
          <label for="opacity">선택 레이어 불투명도</label>
          <input id="opacity" type="range" min="0" max="1" step="0.01" value="1" />
          <span class="pill" id="opacityVal">100%</span>
        </div>

        <div class="layer-wrap">
          <div class="layer-head">
            <span>오버레이 레이어 (최대 3개)</span>
            <button class="mini" id="clearOverlays">전체 삭제</button>
          </div>
          <div class="layer-list" id="layerList">
            <div class="empty">아직 오버레이가 없습니다.</div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="./image-overlayer.js" defer></script>
</body>
</html>
