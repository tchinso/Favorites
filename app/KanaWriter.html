<!-- Hangul → Hiragana / Katakana converter (client‑side only) -->
<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>한글 → 히라가나/가타카나 변환기</title>
  <style>
    :root { --accent:#296eff; --accent-dark:#1c4eb1; --success:#4caf50; }
    *{box-sizing:border-box}
    body{font-family:"Pretendard","Noto Sans KR",sans-serif;margin:0 auto;max-width:860px;padding:2rem 1rem;line-height:1.5}
    h1{font-size:1.5rem;margin-bottom:1rem}
    label{font-weight:600}
    textarea{width:100%;min-height:11rem;font-size:1rem;padding:.75rem;border:1px solid #ccc;border-radius:.5rem;resize:vertical}
    .btn-group{display:flex;flex-wrap:wrap;gap:.5rem;margin:1rem 0}
    button{flex:1 1 10rem;cursor:pointer;border:none;border-radius:.5rem;padding:.75rem 1rem;font-size:1rem;font-weight:600;color:#fff;background:var(--accent);transition:background .15s}
    button:hover{background:var(--accent-dark)}
    #copy{width:100%;margin-top:.5rem;background:var(--success)}
    #copy:hover{background:#3c8e42}
  </style>
</head>
<body>
  <h1>한글 → 히라가나 / 전각·반각 가타카나 변환기</h1>

  <label for="input">입력 (한글)</label>
  <textarea id="input" placeholder="여기에 한글을 입력하세요…&#10;예) 아리가토우고자이마스&#10;인식 안 되는 글자는 로마자 입력가능"></textarea>

  <div class="btn-group">
    <button data-mode="tohiragana">히라가나 변환</button>
    <button data-mode="tofullkatakana">전각 가타카나 변환</button>
    <button data-mode="tohalfkatakana">반각 가타카나 변환</button>
  </div>

  <label for="output">출력</label>
  <textarea id="output" readonly placeholder="변환 결과가 여기에 표시됩니다"></textarea>
  <button id="copy">출력 결과 복사</button>

  <script>
  /* 한글 음절을 분해한 뒤 오십음도 계열 표로 직접 가타카나에 매핑합니다. */
  const CHO = [
    "ㄱ", "ㄲ", "ㄴ", "ㄷ", "ㄸ", "ㄹ", "ㅁ", "ㅂ", "ㅃ",
    "ㅅ", "ㅆ", "ㅇ", "ㅈ", "ㅉ", "ㅊ", "ㅋ", "ㅌ", "ㅍ", "ㅎ"
  ];
  const JUNG = [
    "ㅏ", "ㅐ", "ㅑ", "ㅒ", "ㅓ", "ㅔ", "ㅕ", "ㅖ", "ㅗ", "ㅘ", "ㅙ",
    "ㅚ", "ㅛ", "ㅜ", "ㅝ", "ㅞ", "ㅟ", "ㅠ", "ㅡ", "ㅢ", "ㅣ"
  ];
  const JONG = [
    "", "ㄱ", "ㄲ", "ㄳ", "ㄴ", "ㄵ", "ㄶ", "ㄷ", "ㄹ", "ㄺ", "ㄻ",
    "ㄼ", "ㄽ", "ㄾ", "ㄿ", "ㅀ", "ㅁ", "ㅂ", "ㅄ", "ㅅ", "ㅆ", "ㅇ",
    "ㅈ", "ㅊ", "ㅋ", "ㅌ", "ㅍ", "ㅎ"
  ];

  const VOWEL_KATA = {
    ㅏ: "ア", ㅐ: "エ", ㅑ: "ヤ", ㅒ: "イェ", ㅓ: "オ", ㅔ: "エ",
    ㅕ: "ヨ", ㅖ: "イェ", ㅗ: "オ", ㅘ: "ワ", ㅙ: "ウェ", ㅚ: "ウェ",
    ㅛ: "ヨ", ㅜ: "ウ", ㅝ: "ウォ", ㅞ: "ウェ", ㅟ: "ウィ", ㅠ: "ユ",
    ㅡ: "ウ", ㅢ: "ウィ", ㅣ: "イ"
  };

  const C_HEAD = {
    ㅇ: "", ㄱ: "G", ㄲ: "KK", ㅋ: "K", ㄴ: "N", ㄷ: "D", ㄸ: "TT",
    ㅌ: "T", ㄹ: "R", ㅁ: "M", ㅂ: "B", ㅃ: "PP", ㅍ: "P", ㅅ: "S",
    ㅆ: "SS", ㅈ: "J", ㅉ: "JJ", ㅊ: "CH", ㅎ: "H"
  };

  const CV_TABLE = {
    G: { A: "ガ", E: "ゲ", O: "ゴ", U: "グ", OO: "ゴ", I: "ギ" },
    K: { A: "カ", E: "ケ", O: "コ", U: "ク", OO: "コ", I: "キ" },
    KK: { A: "ッカ", E: "ッケ", O: "ッコ", U: "ック", OO: "ッコ", I: "ッキ" },
    N: { A: "ナ", E: "ネ", O: "ノ", U: "ヌ", OO: "ノ", I: "ニ" },
    D: { A: "ダ", E: "デ", O: "ド", U: "ドゥ", OO: "ド", I: "ディ" },
    T: { A: "タ", E: "テ", O: "ト", U: "トゥ", OO: "ト", I: "ティ" },
    TT: { A: "ッタ", E: "ッテ", O: "ット", U: "ットゥ", OO: "ット", I: "ッティ" },
    R: { A: "ラ", E: "レ", O: "ロ", U: "ル", OO: "ロ", I: "リ" },
    M: { A: "マ", E: "メ", O: "モ", U: "ム", OO: "モ", I: "ミ" },
    B: { A: "バ", E: "ベ", O: "ボ", U: "ブ", OO: "ボ", I: "ビ" },
    P: { A: "パ", E: "ペ", O: "ポ", U: "プ", OO: "ポ", I: "ピ" },
    PP: { A: "ッパ", E: "ッペ", O: "ッポ", U: "ップ", OO: "ッポ", I: "ッピ" },
    S: { A: "サ", E: "セ", O: "ソ", U: "ス", OO: "ソ", I: "シ" },
    SS: { A: "ッサ", E: "ッセ", O: "ッソ", U: "ッス", OO: "ッソ", I: "ッシ" },
    J: { A: "ジャ", E: "ジェ", O: "ジョ", U: "ジュ", OO: "ジョ", I: "ジ" },
    JJ: { A: "ッジャ", E: "ッジェ", O: "ッジョ", U: "ッジュ", OO: "ッジョ", I: "ッジ" },
    CH: { A: "チャ", E: "チェ", O: "チョ", U: "チュ", OO: "チョ", I: "チ" },
    H: { A: "ハ", E: "ヘ", O: "ホ", U: "フ", OO: "ホ", I: "ヒ" }
  };

  function decomposeHangulSyllable(ch) {
    const code = ch.charCodeAt(0);
    const SBase = 0xac00;
    const LCount = 19;
    const VCount = 21;
    const TCount = 28;
    const SIndex = code - SBase;
    if (SIndex < 0 || SIndex >= 11172) return null;
    const LIndex = Math.floor(SIndex / (VCount * TCount));
    const VIndex = Math.floor((SIndex % (VCount * TCount)) / TCount);
    return { cho: CHO[LIndex], jung: JUNG[VIndex], jong: JONG[SIndex % TCount] };
  }

  function jongToTail(jong) {
    if (!jong) return "";
    if (["ㅇ", "ㄴ"].includes(jong)) return "ン";
    if (jong === "ㅁ") return "ム";
    if (["ㄱ", "ㅋ", "ㄲ", "ㄳ", "ㄺ"].includes(jong)) return "ク";
    if (["ㄷ", "ㅌ", "ㅅ", "ㅆ", "ㅈ", "ㅊ", "ㅎ", "ㅄ", "ㄽ", "ㄾ"].includes(jong)) return "ッ";
    if (["ㅂ", "ㅍ", "ㄿ"].includes(jong)) return "プ";
    if (["ㄹ", "ㄻ", "ㄼ", "ㄾ", "ㅀ"].includes(jong)) return "ル";
    return "";
  }

  function cvToKana(cTag, vowel) {
    const baseVowel = VOWEL_KATA[vowel] || "";
    if (!cTag) return baseVowel;

    const key = ["ㅏ", "ㅑ"].includes(vowel) ? "A"
      : ["ㅐ", "ㅔ", "ㅒ", "ㅖ"].includes(vowel) ? "E"
        : ["ㅓ", "ㅕ"].includes(vowel) ? "O"
          : ["ㅜ", "ㅠ", "ㅡ"].includes(vowel) ? "U"
            : ["ㅗ", "ㅛ", "ㅘ", "ㅙ", "ㅚ"].includes(vowel) ? "OO"
              : ["ㅣ", "ㅢ"].includes(vowel) ? "I" : "A";
    const table = CV_TABLE[cTag];
    if (!table) return baseVowel;

    if (vowel === "ㅑ") return cTag === "S" ? "シャ" : cTag === "CH" ? "チャ" : table.I + "ャ";
    if (vowel === "ㅕ" || vowel === "ㅛ") return cTag === "S" ? "ショ" : cTag === "CH" ? "チョ" : table.I + "ョ";
    if (vowel === "ㅠ") return cTag === "S" ? "シュ" : cTag === "CH" ? "チュ" : table.I + "ュ";
    if (vowel === "ㅘ") return table.A + "ワ";
    if (vowel === "ㅙ") return table.E + "ワ";
    if (vowel === "ㅚ" || vowel === "ㅞ") return table.E;
    if (vowel === "ㅝ") return table.U + "ォ";
    if (vowel === "ㅟ" || vowel === "ㅢ") return table.U + "ィ";
    return table[key] || baseVowel;
  }

  function hangulToKatakana(input) {
    let output = "";
    for (const ch of input) {
      const decomposed = decomposeHangulSyllable(ch);
      if (!decomposed) {
        output += ch;
        continue;
      }
      const cTag = C_HEAD[decomposed.cho] || "";
      output += cvToKana(cTag, decomposed.jung) + jongToTail(decomposed.jong);
    }
    return output.replace(/ッッ+/g, "ッ");
  }

  function toHiragana(katakana) {
    return katakana.replace(/[ァ-ヶ]/g, ch => String.fromCharCode(ch.charCodeAt(0) - 0x60));
  }

  const FULL_TO_HALF = new Map([
    ["ア", "ｱ"], ["イ", "ｲ"], ["ウ", "ｳ"], ["エ", "ｴ"], ["オ", "ｵ"],
    ["カ", "ｶ"], ["キ", "ｷ"], ["ク", "ｸ"], ["ケ", "ｹ"], ["コ", "ｺ"],
    ["サ", "ｻ"], ["シ", "ｼ"], ["ス", "ｽ"], ["セ", "ｾ"], ["ソ", "ｿ"],
    ["タ", "ﾀ"], ["チ", "ﾁ"], ["ツ", "ﾂ"], ["テ", "ﾃ"], ["ト", "ﾄ"],
    ["ナ", "ﾅ"], ["ニ", "ﾆ"], ["ヌ", "ﾇ"], ["ネ", "ﾈ"], ["ノ", "ﾉ"],
    ["ハ", "ﾊ"], ["ヒ", "ﾋ"], ["フ", "ﾌ"], ["ヘ", "ﾍ"], ["ホ", "ﾎ"],
    ["マ", "ﾏ"], ["ミ", "ﾐ"], ["ム", "ﾑ"], ["メ", "ﾒ"], ["モ", "ﾓ"],
    ["ヤ", "ﾔ"], ["ユ", "ﾕ"], ["ヨ", "ﾖ"], ["ラ", "ﾗ"], ["リ", "ﾘ"],
    ["ル", "ﾙ"], ["レ", "ﾚ"], ["ロ", "ﾛ"], ["ワ", "ﾜ"], ["ヲ", "ｦ"],
    ["ン", "ﾝ"], ["ァ", "ｧ"], ["ィ", "ｨ"], ["ゥ", "ｩ"], ["ェ", "ｪ"],
    ["ォ", "ｫ"], ["ッ", "ｯ"], ["ャ", "ｬ"], ["ュ", "ｭ"], ["ョ", "ｮ"],
    ["ー", "ｰ"], ["「", "｢"], ["」", "｣"], ["、", "､"], ["。", "｡"], ["・", "･"],
    ["ヴ", "ｳﾞ"], ["ガ", "ｶﾞ"], ["ギ", "ｷﾞ"], ["グ", "ｸﾞ"], ["ゲ", "ｹﾞ"], ["ゴ", "ｺﾞ"],
    ["ザ", "ｻﾞ"], ["ジ", "ｼﾞ"], ["ズ", "ｽﾞ"], ["ゼ", "ｾﾞ"], ["ゾ", "ｿﾞ"],
    ["ダ", "ﾀﾞ"], ["ヂ", "ﾁﾞ"], ["ヅ", "ﾂﾞ"], ["デ", "ﾃﾞ"], ["ド", "ﾄﾞ"],
    ["バ", "ﾊﾞ"], ["ビ", "ﾋﾞ"], ["ブ", "ﾌﾞ"], ["ベ", "ﾍﾞ"], ["ボ", "ﾎﾞ"],
    ["パ", "ﾊﾟ"], ["ピ", "ﾋﾟ"], ["プ", "ﾌﾟ"], ["ペ", "ﾍﾟ"], ["ポ", "ﾎﾟ"]
  ]);

  function toHalfwidthKatakana(katakana) {
    return Array.from(katakana, ch => FULL_TO_HALF.get(ch) || ch).join("");
  }

  function convertHangul(text, mode) {
    const katakana = hangulToKatakana(text);
    if (mode === "tohiragana") return toHiragana(katakana);
    if (mode === "tohalfkatakana") return toHalfwidthKatakana(katakana);
    return katakana;
  }

  function init() {
    const input = document.getElementById("input");
    const output = document.getElementById("output");
    document.querySelectorAll("button[data-mode]").forEach(button => {
      button.addEventListener("click", () => {
        output.value = convertHangul(input.value, button.dataset.mode);
      });
    });
    document.getElementById("copy").addEventListener("click", async () => {
      if (!output.value) return;
      try {
        await navigator.clipboard.writeText(output.value);
      } catch {
        output.select();
        document.execCommand("copy");
      }
    });
  }
  window.addEventListener("DOMContentLoaded", init);
  </script>
</body>
</html>
