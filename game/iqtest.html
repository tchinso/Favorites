<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="robots" content="index, follow">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="keywords" content="IQ 테스트, IQ 검사, 지능 테스트, 퀴즈, 심리 테스트">
    <meta name="description" content="초간단 IQ 테스트로 당신의 지능 수준을 알아보세요! 25개의 문제로 재미있고 간단하게 IQ를 측정해보세요.">
    <title>초간단 IQ 테스트</title>
    <style>
        /* Reset */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #f0f7ff;
            font-family: 'Noto Sans KR', sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        /* Test Container */
        .test-container {
            width: 95%;
            max-width: 600px;
            padding: 5%;
            position: relative;
            min-height: 400px;
            display: flex;
            flex-direction: column;
        }

        /* Progress Bar */
        .progress-bar {
            height: 2vh;
            max-height: 10px;
            background: #e0e0e0;
            border-radius: 10px;
            margin-bottom: 3%;
            overflow: hidden;
            display: none;
        }
        .progress {
            height: 100%;
            background: #9b59b6;
            width: 0;
            transition: width 0.5s;
        }

        /* Intro Screen */
        .intro-screen {
            background: white;
            padding: 8%;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            text-align: center;
            width: 100%;
        }
        
        .intro-screen h1 {
            color: #9b59b6;
            font-size: 2.2rem;
            margin-bottom: 6%;
        }
        
        .intro-screen p {
            color: #555;
            font-size: 1.1rem;
            line-height: 1.6;
            margin-bottom: 8%;
        }
        
        .start-button {
            background: #9b59b6;
            color: white;
            border: none;
            padding: 4% 8%;
            border-radius: 25px;
            cursor: pointer;
            font-size: 1.2rem;
            width: 80%;
            max-width: 250px;
            transition: transform 0.3s, background 0.3s;
        }
        
        .start-button:hover {
            transform: scale(1.05);
            background: #8e44ad;
        }

        /* Question */
        .questions-container {
            flex: 1;
            position: relative;
            width: 100%;
            display: none;
        }
        
        .question {
            background: white;
            padding: 6%;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            margin-bottom: 5%;
            display: none;
            width: 100%;
        }

        .question.active {
            display: block;
            animation: fadeIn 0.35s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(6px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .question h2 {
            color: #2c3e50;
            margin-bottom: 6%;
            font-size: 1.4rem;
            text-align: center;
            line-height: 1.5;
        }

        /* Options */
        .option {
            padding: 5%;
            margin: 3% 0;
            background: #f8f9fa;
            border-radius: 15px;
            cursor: pointer;
            transition: 0.3s;
            font-size: 1.1rem;
            width: 100%;
            text-align: left;
        }
        .option:hover {
            background: #9b59b6;
            color: white;
            transform: scale(1.02);
        }

        /* Result */
        #result {
            display: none;
            text-align: center;
            padding: 6%;
            background: white;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            width: 100%;
        }
        #result h2 {
            color: #9b59b6;
            font-size: 2rem;
            margin-bottom: 5%;
        }
        #result p {
            margin: 5% 0;
            line-height: 1.6;
            color: #555;
            font-size: 1.1rem;
        }
        #retry {
            background: #9b59b6;
            color: white;
            border: none;
            padding: 4% 8%;
            border-radius: 25px;
            cursor: pointer;
            font-size: 1.1rem;
            margin-top: 5%;
            width: 80%;
            max-width: 250px;
        }
        
        /* 공유 버튼 */
        #shareButton {
            background: #2c3e50;
            color: white;
            border: none;
            padding: 4% 8%;
            border-radius: 25px;
            cursor: pointer;
            font-size: 1.1rem;
            margin-top: 15px;
            width: 80%;
            max-width: 250px;
        }
        
        /* 저장 버튼 */
        #saveResult {
            background: #27ae60;
            color: white;
            border: none;
            padding: 4% 8%;
            border-radius: 25px;
            cursor: pointer;
            font-size: 1.1rem;
            margin-top: 15px;
            width: 80%;
            max-width: 250px;
        }

        /* 모바일 최적화 */
        @media (max-width: 768px) {
            .test-container {
                width: 98%;
                padding: 5%;
            }
            
            .intro-screen h1 {
                font-size: 7vw;
            }
            
            .intro-screen p {
                font-size: 4vw;
            }
            
            .start-button {
                font-size: 5vw;
                padding: 5% 10%;
            }

            .question h2 {
                font-size: 5vw;
                margin-bottom: 8%;
            }
            
            .option {
                padding: 6%;
                margin: 4% 0;
                font-size: 4.5vw;
            }
            
            #result h2 {
                font-size: 6vw;
            }
            
            #result p {
                font-size: 4vw;
                line-height: 1.8;
            }
            
            #retry, #saveResult, #shareButton {
                padding: 5% 10%;
                font-size: 4.5vw;
                width: 90%;
            }
        }
        
        @media (max-width: 480px) {
            body {
                padding: 0 1%;
            }
            
            .test-container {
                width: 100%;
                padding: 6% 4%;
            }
            
            .intro-screen {
                padding: 10% 6%;
            }
            
            .question {
                padding: 8% 5%;
            }
            
            .question h2 {
                font-size: 5.5vw;
            }
            
            .option {
                padding: 7%;
                margin: 5% 0;
                font-size: 5vw;
            }
            
            #retry, #saveResult, #shareButton {
                width: 100%;
                padding: 6% 0;
            }
        }
    </style>
</head>
<body>
    <div class="test-container">
        <!-- 인트로 화면 -->
        <div class="intro-screen" id="intro">
            <h1>초간단 IQ 테스트</h1>
            <p>25개의 문제를 통해 당신의 지능 수준을 재미있게 알아보세요! 이 테스트는 논리적 사고, 패턴 인식, 수리 능력 등 다양한 인지 능력을 측정합니다.</p>
            <p>이 테스트는 전문적인 IQ 검사를 대체할 수 없으며, 재미로만 활용하세요.</p>
            <button class="start-button" id="startTest">테스트 시작하기</button>
        </div>

        <div class="progress-bar" aria-label="테스트 진행률">
            <div class="progress" id="progress"></div>
        </div>

        <div class="questions-container" id="questionsContainer">
            <!-- 질문 25개는 테스트 시작 때마다 순서를 섞어 생성됩니다. -->
            <div id="questionList"></div>

            <!-- 결과 화면 -->
            <div id="result">
                <h2 id="resultTitle"></h2>
                <p id="resultScore"></p>
                <p id="resultDesc"></p>
                
                <button id="shareButton">결과 공유하기</button>
                <button id="saveResult">결과 저장하기</button>
                <button id="retry">다시하기</button>
            </div>
        </div>
    </div>

    <script>
        // 질문 데이터
        const questions = [
            { q: "🔢 다음 수열의 다음 숫자는 무엇일까요? 2, 4, 6, 8, ...", options: [["9", 0], ["10", 1], ["12", 0], ["16", 0]] },
            { q: "🧩 다음 중 나머지와 다른 하나는?", options: [["사과", 0], ["바나나", 0], ["오렌지", 0], ["당근", 1]] },
            { q: "📐 정사각형 : 4 = 정삼각형 : ?", options: [["2", 0], ["3", 1], ["5", 0], ["6", 0]] },
            { q: "🔤 APPLE은 DSSOH이라면, BANANA는?", options: [["EDQDQD", 1], ["DCPCPC", 0], ["EDPDPD", 0], ["CBOBOB", 0]] },
            { q: "🧠 '물'과 '컵'의 관계는 '사람'과 다음 중 어떤 것의 관계와 같을까요?", options: [["음식", 0], ["집", 1], ["옷", 0], ["친구", 0]] },
            { q: "🔍 다음 도형의 패턴을 완성하세요: ○□△○□?", options: [["△", 1], ["○", 0], ["□", 0], ["☆", 0]] },
            { q: "🧮 72 ÷ 8 × 3 + 5 = ?", options: [["27", 0], ["32", 1], ["34", 0], ["37", 0]] },
            { q: "🎯 다음 중 가장 적절한 단어는? 새 : 날다 = 물고기 : ?", options: [["헤엄치다", 1], ["바다", 0], ["지느러미", 0], ["아가미", 0]] },
            { q: "🧠 다음 중 논리적으로 반드시 참인 것은?<br>모든 A는 B이다. 모든 B는 C이다. D는 A이다.", options: [["D는 C이다", 1], ["C는 D이다", 0], ["D는 B가 아니다", 0], ["B는 D가 아니다", 0]] },
            { q: "🔤 QWERTY : DVORAK = 한글 : ?", options: [["영어", 0], ["천지인", 1], ["일본어", 0], ["중국어", 0]] },
            { q: "🧠 다음 중 논리적으로 다른 하나는?", options: [["개와 고양이", 0], ["사자와 호랑이", 0], ["상어와 돌고래", 1], ["독수리와 참새", 0]] },
            { q: "📊 다음 수열에서 빠진 숫자는? 3, 6, 11, 18, ?, 38", options: [["24", 0], ["27", 1], ["29", 0], ["32", 0]] },
            { q: "🧩 다음 중 나머지와 성질이 다른 하나는?", options: [["소수", 0], ["짝수", 0], ["완전수", 1], ["자연수", 0]] },
            { q: "🧩 다음 중 가장 어울리지 않는 것은?", options: [["피아노", 0], ["바이올린", 0], ["기타", 0], ["드럼", 1]] },
            { q: "🧮 어떤 수에 5를 곱하고 3을 빼면 27이 됩니다. 이 수는?", options: [["5", 0], ["6", 1], ["7", 0], ["8", 0]] },
            { q: "🧠 다음 중 서로 다른 두 소수의 곱으로만 이루어진 수는?", options: [["30", 0], ["15", 1], ["18", 0], ["27", 0]] },
            { q: "🧠 '책'과 '지식'의 관계는 '운동'과 다음 중 어떤 것의 관계와 같을까요?", options: [["체육관", 0], ["건강", 1], ["땀", 0], ["선수", 0]] },
            { q: "📏 다음 도형의 면적이 다른 하나는?", options: [["가로 3cm, 세로 4cm인 직사각형", 0], ["한 변의 길이가 6cm인 정삼각형", 0], ["지름이 4cm인 원", 0], ["한 변의 길이가 3cm인 정사각형", 1]] },
            { q: "🔢 다음 수열의 규칙을 찾아 빈칸에 들어갈 숫자는? 1, 4, 9, 16, 25, ?", options: [["30", 0], ["36", 1], ["42", 0], ["49", 0]] },
            { q: "🧩 다음 중 논리적으로 가장 적합한 것은? 손 : 장갑 = 발 : ?", options: [["신발", 1], ["양말", 0], ["바지", 0], ["발가락", 0]] },
            { q: "🧠 다음 논리 퍼즐의 답은?<br>세 친구 A, B, C가 있습니다.<br> A는 항상 진실만 말하고,<br> B는 항상 거짓만 말하며,<br>C는 진실과 거짓을 섞어 말합니다.<br>어느 날 셋 중 한 명이<br>\"나는 B다.\"라고 말했습니다.<br>이 말을 한 사람은 누구일까요?", options: [["B", 1], ["A", 0], ["C", 0], ["정답을 알 수 없다", 0]] },
            { q: "🧮 어떤 수의 25%는 20입니다. 이 수는?", options: [["5", 0], ["40", 0], ["80", 1], ["100", 0]] },
            { q: "🔤 다음 문자열에서 빠진 문자는? A, D, G, J, ?", options: [["L", 0], ["M", 0], ["M", 1], ["O", 0]] },
            { q: "🧠 다음 중 가장 적절한 비유는? 시간 : 시계 = 온도 : ?", options: [["날씨", 0], ["온도계", 1], ["더위", 0], ["계절", 0]] },
            { q: "🧠 다음 논리 문제의 결론으로<br>가장 적절한 것은?<br>모든 정사각형은 직사각형이다.<br>모든 직사각형은 평행사변형이다.<br>어떤 도형 A는 정사각형이다.", options: [["A는 평행사변형이다", 1], ["A는 직사각형이 아니다", 0], ["A는 평행사변형이 아닐 수도 있다", 0], ["A는 정사각형이 아니다", 0]] }
        ];

        // 결과 데이터
        const results = {
            "borderline": {
                title: "경계선 지능 (IQ 70-85)",
                desc: "일부 학습과 인지 영역에서 어려움을 경험할 수 있습니다. 구조화된 환경과 추가적인 지원이 도움이 될 수 있습니다."
            },
            "very_low": {
                title: "낮은 범위 (IQ 0-69)",
                desc: "이 결과는 짧은 온라인 테스트의 참고용 점수이며, 전문적인 지능 검사를 대신하지 않습니다."
            },
            "below_average": {
                title: "평균 이하 (IQ 86-100)",
                desc: "대부분의 기본적인 과제를 수행할 수 있지만, 복잡한 개념이나 추상적 사고에 어려움이 있을 수 있습니다."
            },
            "average": {
                title: "평균 (IQ 101-115)",
                desc: "일반적인 인지 능력을 갖추고 있으며, 대부분의 학습과 일상 과제를 무리 없이 수행할 수 있습니다."
            },
            "above_average": {
                title: "평균 이상 (IQ 116-130)",
                desc: "논리적 사고와 문제 해결 능력이 뛰어나며, 복잡한 개념을 빠르게 이해하고 적용할 수 있습니다."
            },
            "superior": {
                title: "우수 (IQ 131-145)",
                desc: "높은 수준의 추상적 사고와 문제 해결 능력을 갖추고 있으며, 복잡한 과제를 효율적으로 처리할 수 있습니다."
            },
            "very_superior": {
                title: "매우 우수 (IQ 146 이상)",
                desc: "뛰어난 인지 능력과 창의적 사고를 갖추고 있으며, 매우 복잡한 문제도 효과적으로 해결할 수 있습니다."
            }
        };

        // 25문제 기준: 4초 정답 4점, 즉시 정답 12점, 전체 결과 범위 0~300
        const SPEED_BENCHMARK_SECONDS = 4;
        const SCORE_TIME_STEP_SECONDS = 0.1;
        const BASELINE_POINTS_PER_CORRECT = 4;
        const MAX_IQ = 300;

        let currentQuestion = 1;
        const totalQuestions = questions.length;
        let score = 0;
        let answers = [];
        let questionStartedAt = 0;
        let questionAnswered = false;

        const questionList = document.getElementById('questionList');

        function shuffle(items) {
            const shuffled = [...items];
            for (let index = shuffled.length - 1; index > 0; index--) {
                const randomIndex = Math.floor(Math.random() * (index + 1));
                [shuffled[index], shuffled[randomIndex]] = [shuffled[randomIndex], shuffled[index]];
            }
            return shuffled;
        }

        function renderQuestions() {
            questionList.innerHTML = '';

            shuffle(questions).forEach((question, index) => {
                const questionElement = document.createElement('div');
                questionElement.className = 'question' + (index === 0 ? ' active' : '');
                questionElement.dataset.step = index + 1;

                const heading = document.createElement('h2');
                heading.innerHTML = question.q;
                questionElement.appendChild(heading);

                shuffle(question.options).forEach(([label, type]) => {
                    const option = document.createElement('div');
                    option.className = 'option';
                    option.dataset.type = type;
                    option.innerHTML = label;
                    option.addEventListener('click', handleOptionClick);
                    questionElement.appendChild(option);
                });

                questionList.appendChild(questionElement);
            });
        }

        // 테스트 시작 버튼 이벤트
        document.getElementById('startTest').addEventListener('click', function() {
            currentQuestion = 1;
            score = 0;
            answers = [];
            renderQuestions();
            document.getElementById('intro').style.display = 'none';
            document.querySelector('.progress-bar').style.display = 'block';
            document.querySelector('.questions-container').style.display = 'block';
            startQuestionTimer();
            updateProgress();
        });

        // 진행 상태 업데이트
        function updateProgress() {
            const progressBar = document.getElementById('progress');
            const progressPercentage = Math.min(100, ((currentQuestion - 1) / totalQuestions) * 100);
            progressBar.style.width = `${progressPercentage}%`;
        }

        function startQuestionTimer() {
            questionStartedAt = performance.now();
            questionAnswered = false;
        }

        function getElapsedSeconds() {
            return (performance.now() - questionStartedAt) / 1000;
        }

        function calculateQuestionPoints(elapsedSeconds, isCorrect) {
            if (!isCorrect) return 0;

            const measuredSeconds = Math.max(
                0,
                Math.round(elapsedSeconds / SCORE_TIME_STEP_SECONDS) * SCORE_TIME_STEP_SECONDS
            );

            let speedMultiplier;
            if (measuredSeconds <= SPEED_BENCHMARK_SECONDS) {
                speedMultiplier = 1 + ((SPEED_BENCHMARK_SECONDS - measuredSeconds) / SPEED_BENCHMARK_SECONDS) * 2;
            } else {
                speedMultiplier = Math.max(0, 1 - ((measuredSeconds - SPEED_BENCHMARK_SECONDS) / 8));
            }

            return BASELINE_POINTS_PER_CORRECT * speedMultiplier;
        }

        // 다음 질문으로 이동
        function goToNextQuestion() {
            const currentQuestionElement = document.querySelector(`.question[data-step="${currentQuestion}"]`);
            currentQuestionElement.classList.remove('active');
            currentQuestion++;

            if (currentQuestion <= totalQuestions) {
                const nextQuestionElement = document.querySelector(`.question[data-step="${currentQuestion}"]`);
                nextQuestionElement.classList.add('active');
                updateProgress();
                startQuestionTimer();
            } else {
                showResult();
            }
        }

        function handleOptionClick(event) {
            if (questionAnswered || !questionStartedAt) return;
            questionAnswered = true;

            const elapsed = getElapsedSeconds();
            const isCorrect = event.currentTarget.getAttribute('data-type') === '1';
            const points = calculateQuestionPoints(elapsed, isCorrect);

            answers[currentQuestion - 1] = {
                correct: isCorrect,
                elapsed,
                points
            };
            score += points;
            goToNextQuestion();
        }

        // 결과 표시
        function showResult() {
            questionStartedAt = 0;

            const iq = Math.max(0, Math.min(MAX_IQ, score));

            let resultCategory;
            if (iq <= 69) {
                resultCategory = "very_low";
            } else if (iq <= 85) {
                resultCategory = "borderline";
            } else if (iq <= 100) {
                resultCategory = "below_average";
            } else if (iq <= 115) {
                resultCategory = "average";
            } else if (iq <= 130) {
                resultCategory = "above_average";
            } else if (iq <= 145) {
                resultCategory = "superior";
            } else {
                resultCategory = "very_superior";
            }

            const result = results[resultCategory];
            document.getElementById('resultTitle').innerText = result.title;
            document.getElementById('resultScore').innerText = `당신의 IQ: ${iq.toFixed(2)}`;
            document.getElementById('resultDesc').innerText = result.desc;
            document.getElementById('result').style.display = 'block';
            updateProgress();
        }

        // 테스트 다시 시작
        document.getElementById('retry').addEventListener('click', function() {
            currentQuestion = 1;
            score = 0;
            answers = [];
            questionStartedAt = 0;
            questionAnswered = false;

            document.getElementById('result').style.display = 'none';
            document.querySelector('.questions-container').style.display = 'none';
            document.querySelector('.progress-bar').style.display = 'none';
            document.getElementById('intro').style.display = 'block';
            updateProgress();
        });

        // 결과 저장하기
        document.getElementById('saveResult').addEventListener('click', function() {
            document.getElementById('shareButton').style.display = 'none';
            document.getElementById('saveResult').style.display = 'none';
            document.getElementById('retry').style.display = 'none';

            const script = document.createElement('script');
            script.src = 'https://html2canvas.hertzen.com/dist/html2canvas.min.js';
            script.onload = function() {
                const resultElement = document.getElementById('result');
                html2canvas(resultElement).then(canvas => {
                    const image = canvas.toDataURL('image/png');
                    const link = document.createElement('a');
                    link.href = image;
                    link.download = '초간단_IQ_테스트_결과.png';
                    link.click();

                    setTimeout(function() {
                        document.getElementById('shareButton').style.display = 'inline-block';
                        document.getElementById('saveResult').style.display = 'inline-block';
                        document.getElementById('retry').style.display = 'inline-block';
                    }, 1000);
                });
            };
            document.head.appendChild(script);
        });

        // 공유 기능
        document.getElementById('shareButton').addEventListener('click', function() {
            if (navigator.share) {
                navigator.share({
                    title: '초간단 IQ 테스트 결과',
                    text: `내 결과: ${document.getElementById('resultTitle').innerText} (${document.getElementById('resultScore').innerText})`,
                    url: window.location.href
                }).catch(error => console.log('공유 중 오류가 발생했습니다:', error));
            } else {
                alert('이 브라우저에서는 공유 기능을 지원하지 않습니다.');
            }
        });
    </script>
</body>
</html>
